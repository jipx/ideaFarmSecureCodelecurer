<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Student Portal governed assignment submission and AI feedback architecture</title>
  <desc id="desc">AWS architecture showing authenticated submission, immutable storage, asynchronous Bedrock feedback, deterministic validation, lecturer approval, observability and Well-Architected controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182b"/><stop offset="1" stop-color="#102f4d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#5ed8ff"/></marker>
    <style>.t{font-family:Arial,sans-serif;fill:#f4f8fc}.muted{font-family:Arial,sans-serif;fill:#a9bfd4}.box{fill:#102a46;stroke:#4f779c;stroke-width:2;rx:16}.aws{fill:#182f48;stroke:#ff9900;stroke-width:3;rx:16}.gate{fill:#20364d;stroke:#62d6a8;stroke-width:3;rx:16}.line{stroke:#5ed8ff;stroke-width:4;fill:none;marker-end:url(#arrow)}.small{font-size:18px}.label{font-size:17px;font-weight:700;fill:#ffb45b}.head{font-size:28px;font-weight:700}.sub{font-size:20px}</style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text class="t" x="70" y="70" font-size="38" font-weight="700">Student Portal · Contract-to-Evidence Architecture</text>
  <text class="muted" x="70" y="108" font-size="21">Immutable submission • asynchronous AI assistance • deterministic validation • lecturer authority</text>
  <rect x="55" y="145" width="1490" height="480" rx="24" fill="#091d33" stroke="#315777" stroke-width="2"/>
  <text class="label" x="85" y="185">PRIMARY WORKFLOW</text>
  <g filter="url(#shadow)"><rect class="box" x="80" y="225" width="190" height="125"/><text class="head t" x="175" y="270" text-anchor="middle">Student</text><text class="small muted" x="175" y="305" text-anchor="middle">Portal / SPA</text><text class="small muted" x="175" y="332" text-anchor="middle">idempotency key</text></g>
  <g filter="url(#shadow)"><rect class="aws" x="330" y="225" width="210" height="125"/><text class="label" x="435" y="260" text-anchor="middle">AWS EDGE</text><text class="sub t" x="435" y="295" text-anchor="middle">CloudFront + WAF</text><text class="small muted" x="435" y="325" text-anchor="middle">Cognito identity</text></g>
  <g filter="url(#shadow)"><rect class="aws" x="600" y="225" width="230" height="125"/><text class="label" x="715" y="260" text-anchor="middle">DURABLE INTAKE</text><text class="sub t" x="715" y="295" text-anchor="middle">API Gateway + Lambda</text><text class="small muted" x="715" y="325" text-anchor="middle">validate · authorize · 202</text></g>
  <g filter="url(#shadow)"><rect class="aws" x="900" y="195" width="240" height="85"/><text class="sub t" x="1020" y="232" text-anchor="middle">Amazon S3 Versioning</text><text class="small muted" x="1020" y="260" text-anchor="middle">artifact + content hash</text><rect class="aws" x="900" y="305" width="240" height="85"/><text class="sub t" x="1020" y="342" text-anchor="middle">Amazon DynamoDB</text><text class="small muted" x="1020" y="370" text-anchor="middle">status + idempotency</text></g>
  <g filter="url(#shadow)"><rect class="aws" x="1210" y="225" width="255" height="125"/><text class="label" x="1338" y="260" text-anchor="middle">ASYNC CONTROL</text><text class="sub t" x="1338" y="292" text-anchor="middle">EventBridge + SQS</text><text class="small muted" x="1338" y="322" text-anchor="middle">buffer · retry · DLQ</text></g>
  <path class="line" d="M270 288H325"/><path class="line" d="M540 288H595"/><path class="line" d="M830 260H895"/><path class="line" d="M830 320H895"/><path class="line" d="M1140 288H1205"/>
  <g filter="url(#shadow)"><rect class="aws" x="1080" y="445" width="280" height="125"/><text class="label" x="1220" y="480" text-anchor="middle">ORCHESTRATION</text><text class="sub t" x="1220" y="515" text-anchor="middle">AWS Step Functions</text><text class="small muted" x="1220" y="545" text-anchor="middle">timeouts · retry budgets</text></g>
  <g filter="url(#shadow)"><rect class="aws" x="700" y="445" width="290" height="125"/><text class="label" x="845" y="480" text-anchor="middle">GROUNDED AI</text><text class="sub t" x="845" y="515" text-anchor="middle">Amazon Bedrock</text><text class="small muted" x="845" y="543" text-anchor="middle">rubric + artifact evidence</text></g>
  <g filter="url(#shadow)"><rect class="gate" x="330" y="445" width="280" height="125"/><text class="label" x="470" y="480" text-anchor="middle">DETERMINISTIC GATE</text><text class="sub t" x="470" y="515" text-anchor="middle">Schema · citations · totals</text><text class="small muted" x="470" y="545" text-anchor="middle">PASS / REVIEW / REJECT</text></g>
  <g filter="url(#shadow)"><rect class="gate" x="80" y="445" width="190" height="125"/><text class="label" x="175" y="480" text-anchor="middle">AUTHORITY</text><text class="sub t" x="175" y="515" text-anchor="middle">Lecturer approval</text><text class="small muted" x="175" y="545" text-anchor="middle">publish / override</text></g>
  <path class="line" d="M1338 350V420H1220V440"/><path class="line" d="M1080 508H995"/><path class="line" d="M700 508H615"/><path class="line" d="M330 508H275"/>
  <rect x="55" y="655" width="1490" height="270" rx="24" fill="#0a2037" stroke="#315777" stroke-width="2"/>
  <text class="label" x="85" y="695">WELL-ARCHITECTED CONTROL AND EVIDENCE PLANE</text>
  <g transform="translate(80 730)"><rect class="box" width="220" height="145"/><text class="sub t" x="110" y="38" text-anchor="middle">Operational Excellence</text><text class="small muted" x="110" y="76" text-anchor="middle">trace + runbooks</text><text class="small muted" x="110" y="108" text-anchor="middle">versioned releases</text></g>
  <g transform="translate(325 730)"><rect class="box" width="220" height="145"/><text class="sub t" x="110" y="38" text-anchor="middle">Security</text><text class="small muted" x="110" y="76" text-anchor="middle">RBAC + KMS</text><text class="small muted" x="110" y="108" text-anchor="middle">tenant isolation</text></g>
  <g transform="translate(570 730)"><rect class="box" width="220" height="145"/><text class="sub t" x="110" y="38" text-anchor="middle">Reliability</text><text class="small muted" x="110" y="76" text-anchor="middle">SQS + DLQ</text><text class="small muted" x="110" y="108" text-anchor="middle">reconciliation</text></g>
  <g transform="translate(815 730)"><rect class="box" width="220" height="145"/><text class="sub t" x="110" y="38" text-anchor="middle">Performance</text><text class="small muted" x="110" y="76" text-anchor="middle">P95 ≤ 1 second</text><text class="small muted" x="110" y="108" text-anchor="middle">queue age + TTFT</text></g>
  <g transform="translate(1060 730)"><rect class="box" width="220" height="145"/><text class="sub t" x="110" y="38" text-anchor="middle">Cost</text><text class="small muted" x="110" y="76" text-anchor="middle">right-size model</text><text class="small muted" x="110" y="108" text-anchor="middle">token budgets</text></g>
  <g transform="translate(1305 730)"><rect class="box" width="220" height="145"/><text class="sub t" x="110" y="38" text-anchor="middle">Sustainability</text><text class="small muted" x="110" y="76" text-anchor="middle">event-driven scale</text><text class="small muted" x="110" y="108" text-anchor="middle">smallest capable FM</text></g>
  <text class="muted" x="80" y="952" font-size="18">Invariant: every accepted upload remains immutable and attributable; AI cannot publish marks or feedback.</text>
</svg>
